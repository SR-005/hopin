{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="{% static 'hopin_app/css/signup.css' %}">


    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

{% load static %}

<body style="
    background: url('{% static 'hopin_app/images/otpbg.png' %}') no-repeat center center;
    background-size: contain;
    background-color: black;
    height: 100vh;
">

    {# default message display snippet- as web popup #}
    {% if messages %}
        {% for message in messages %}
        <script>
            alert("{{ message|escapejs }}");
        </script>
        {% endfor %}
    {% endif %}


    <!-- Modal Box -->
    <div id="modal" class="fixed inset-0 flex items-center justify-center backdrop-blur-sm bg-black/20">
        <div class="bg-white rounded-2xl p-6 w-[90%] max-w-md shadow-lg relative">

            <h2 class="text-2xl font-bold mb-4">Verify Your Account</h2>

            <!-- PHONE FORM -->
            {% if not otpsent %}
            <form method="POST" action="{% url 'verify' %}">
                {% csrf_token %}
                <input name="phone" type="text" placeholder="Phone Number" class="w-full border p-2 mb-4 rounded">
                <button type="submit" name="action" value="sendotp" class="w-full bg-[#191265] text-white py-2 rounded-lg">Send OTP</button>
            </form>
            {% endif %}

            <!-- OTP FORM -->
            {% if otpsent %}
            <form method="POST" action="{% url 'verify' %}">
                {% csrf_token %}
                <input name="otp" type="text" placeholder="Enter OTP" class="w-full border p-2 mb-4 rounded">
                <button type="submit" name="action" value="verifyotp" class="w-full bg-green-600 text-white py-2 rounded-lg">Verify OTP</button>
            </form>
            {% endif %}

            <a href="{% url 'logout' %}" class="block px-4 py-2 hover:bg-red-100 text-red-600">
                <button type="submit" name="action" value="cancelverify" class="w-full mt-2 bg-red-500 text-white py-2 rounded-lg">Cancel</button>
            </a>

        </div>
    </div>

<script>
    // Modal is already visible by default (no hidden class)

    function closeModal() {
        document.getElementById("signupModal").style.display="none";
    }
</script>
</body>
