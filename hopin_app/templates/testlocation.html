<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location</title>
</head>
<body>

    {# default message display snippet- as web popup #}
    {% if messages %}
        {% for message in messages %}
            <script>
            alert("{{ message|escapejs }}");
            </script>
        {% endfor %}
    {% endif %}

    <h1>Live Location</h1>
    <input type="hidden" name="rideid" id="rideid" value="{{ rideid }}">

    {% for rider in riders %}
        <form method="POST" action="{% url 'testlocation' rideid %}">
            {% csrf_token %}
            <p>{{ rider }}</p>
            <input type="hidden" name="tripid" id="tripid" value="{{ rideid }}">
            <input type="hidden" name="requestid" id="requestid" value="{{ rider.id }}">
            <button type="submit" name="action" value="pickup">Pickup</button>
        </form>
    {% endfor %}

    <script>
        //csrf token for form submission
        function getCookie(name) {
            let cookieValue=null;
            if (document.cookie && document.cookie !== "") {
                const cookies=document.cookie.split(";");
                for (let i=0; i < cookies.length; i++) {
                    const cookie=cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue=decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken=getCookie("csrftoken");

        //send location
        navigator.geolocation.watchPosition(
            sendLocation,
            console.error,
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 3000
            }
        );

        function sendLocation(position){
            
            const lat=position.coords.latitude;
            const lng=position.coords.longitude;
            const rideid="{{ rideid }}";

            fetch(`/updatelocation/${rideid}/`, {
                method: "POST",
                headers:{
                    "Content-Type":"application/json",
                    "X-CSRFToken": csrftoken
                },
                body: JSON.stringify({
                    latitude: lat,
                    longitude: lng
                })
            })
            .then(res => res.json())
                .then(data => {
                    console.log("Driver:", data);

                    if (data.status === "COMPLETED") {
                        alert("Ride Completed!");
                        window.location.href="/";
                    }
                })
                .catch(err => console.error(err));
            }

    </script>
</body>
</html>
