<div id="toast-container" class="pointer-events-none fixed top-20 right-5 z-[1100] flex w-full max-w-sm flex-col gap-3"></div>
<script>
    (function () {
        if (window.HopinToast) {
            return;
        }

        const icons = {
            success: '<svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11.917 9.724 16.5 19 7.5"/></svg>',
            error: '<svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6m0 12L6 6"/></svg>',
            info: '<svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11v5m2-9h.01M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>'
        };

        const iconStyles = {
            success: "text-green-700 bg-green-100",
            error: "text-red-700 bg-red-100",
            info: "text-blue-700 bg-blue-100"
        };

        function resolveType(type) {
            return type === "success" || type === "error" ? type : "info";
        }

        function dismissToast(toast) {
            if (!toast || toast.dataset.closing === "1") {
                return;
            }

            toast.dataset.closing = "1";
            toast.classList.add("opacity-0", "translate-y-2");
            window.setTimeout(function () {
                toast.remove();
            }, 250);
        }

        function show(message, type = "info", duration = 4000) {
            const container = document.getElementById("toast-container");
            if (!container || !message) {
                return;
            }

            const variant = resolveType(type);
            const toastId = "toast-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
            const toast = document.createElement("div");

            toast.id = toastId;
            toast.setAttribute("role", "alert");
            toast.className = "pointer-events-auto flex w-full items-center rounded-2xl border border-slate-200 bg-white p-4 text-slate-700 shadow-lg transition-all duration-200 opacity-0 translate-y-2";
            toast.innerHTML = `
                <div class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg ${iconStyles[variant]}">
                    ${icons[variant]}
                    <span class="sr-only">${variant} icon</span>
                </div>
                <div class="ms-3 text-sm font-medium" data-toast-message></div>
                <button type="button" class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg border border-transparent bg-transparent text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-200" data-dismiss-target="#${toastId}" data-toast-close aria-label="Close">
                    <span class="sr-only">Close</span>
                    <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
                    </svg>
                </button>
            `;

            const messageNode = toast.querySelector("[data-toast-message]");
            const closeButton = toast.querySelector("[data-toast-close]");
            if (messageNode) {
                messageNode.textContent = message;
            }
            if (closeButton) {
                closeButton.addEventListener("click", function () {
                    dismissToast(toast);
                });
            }

            container.appendChild(toast);
            window.requestAnimationFrame(function () {
                toast.classList.remove("opacity-0", "translate-y-2");
            });

            if (duration > 0) {
                window.setTimeout(function () {
                    dismissToast(toast);
                }, duration);
            }
        }

        window.HopinToast = {
            show: show,
            dismiss: dismissToast
        };
        window.showToast = show;
    }());
</script>
{% if messages %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        {% for message in messages %}
        window.HopinToast.show("{{ message|escapejs }}", "{{ message.tags|default:'info'|escapejs }}");
        {% endfor %}
    });
</script>
{% endif %}
